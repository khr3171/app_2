<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산광역시사회서비스원 규정실무 헬퍼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- 상단 헤더: 기관 로고 및 명칭 강조 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- 좌측: 부산광역시사회서비스원 CI 심볼 및 텍스트 로고 -->
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-sky-500 flex items-center justify-center shadow-md shadow-teal-500/10 group-hover:scale-105 transition-transform">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold tracking-wider text-teal-700 bg-teal-50 px-2 py-0.5 rounded">공공기관</span>
            <span class="text-xs text-slate-400 font-medium tracking-tight">BUSAN SOCIAL SERVICE AGENCY</span>
          </div>
          <span class="text-lg font-extrabold text-slate-900 tracking-tight group-hover:text-teal-600 transition-colors">
            부산광역시사회서비스원 <span class="font-normal text-slate-500 text-sm ml-1">규정실무 헬퍼</span>
          </span>
        </div>
      </a>

      <!-- 우측 보조 링크 버튼 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="https://www.law.go.kr" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-teal-600 bg-slate-100 hover:bg-slate-200/80 px-3 py-2 rounded-lg transition-colors">
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>
          국가법령정보센터
        </a>
        <button id="calc-btn" class="inline-flex items-center gap-1.5 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 px-3.5 py-2 rounded-lg shadow-sm transition-colors">
          <i class="fa-solid fa-calculator text-[11px]"></i>
          수당 간편계산기
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 히어로 섹션 (요청하신 안내 설명 문구 완전 삭제, 검색창 집중형 레이아웃) -->
  <section class="bg-white border-b border-slate-200/80 py-12 sm:py-16">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center">
      
      <!-- 핵심 배지 -->
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold mb-4">
        <span class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
        사서원 실무 규정 원스톱 가이드
      </div>

      <!-- 메인 타이틀 -->
      <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-8">
        궁금한 실무 규정이나 수당 기준을 검색하세요
      </h1>

      <!-- 검색창 컴포넌트 -->
      <div class="relative max-w-2xl mx-auto">
        <div class="relative flex items-center shadow-lg shadow-slate-200/70 rounded-2xl overflow-hidden border-2 border-slate-200 focus-within:border-teal-500 focus-within:ring-4 focus-within:ring-teal-500/10 transition-all bg-white">
          <div class="pl-5 text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
          </div>
          <input 
            type="text" 
            id="search-input" 
            placeholder="예: 심사수당, 출장여비, 회의비, 2시간 심사, 외부강의 등" 
            class="w-full py-4 pl-3 pr-28 text-slate-900 placeholder-slate-400 font-medium focus:outline-none text-sm sm:text-base"
          />
          <button 
            id="search-btn" 
            class="absolute right-2 px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-sm transition-all shadow-sm flex items-center gap-1.5"
          >
            검색
          </button>
        </div>

        <!-- 빠른 추천 검색 태그 -->
        <div class="flex flex-wrap items-center justify-center gap-2 mt-4 text-xs font-medium text-slate-500">
          <span class="font-semibold text-slate-400">자주 찾는 질문:</span>
          <button class="quick-tag px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" data-keyword="심사수당"># 심사수당 (2시간 기준)</button>
          <button class="quick-tag px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" data-keyword="출장여비"># 출장여비 (시내/시외)</button>
          <button class="quick-tag px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" data-keyword="회의비"># 회의비 (1인 3만원)</button>
          <button class="quick-tag px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" data-keyword="외부강의"># 외부강의 신고기준</button>
        </div>
      </div>

    </div>
  </section>

  <!-- 콘텐츠 영역 (검색 결과 및 규정 목록) -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full">
    <!-- 결과 헤더 -->
    <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <h2 class="text-base font-bold text-slate-900">검색 결과</h2>
        <span id="result-count" class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-teal-100 text-teal-800">0건</span>
      </div>
      <button id="show-all-btn" class="text-xs font-semibold text-slate-500 hover:text-slate-800 underline">
        전체 규정 목록 보기
      </button>
    </div>

    <!-- 동적 렌더링 카드 컨테이너 -->
    <div id="rules-container" class="space-y-4">
      <!-- JavaScript를 통해 규정 카드가 동적으로 주입됩니다 -->
    </div>
  </main>

  <!-- 간소화된 푸터 (하단 안내 텍스트 완전 제거) -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-600">부산광역시사회서비스원</span>
        <span>규정실무 헬퍼</span>
      </div>
      <p>© Busan Social Service Agency. All rights reserved.</p>
    </div>
  </footer>

  <!-- 데이터 및 스크립트 연결 -->
  <script src="rules_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
